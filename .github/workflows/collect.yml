name: Collect prices

# Daily: fetch every source, validate, commit the data to the repo, redeploy the
# dashboard. A failing run opens (or updates) a GitHub issue; the next healthy run
# closes it. Partial data from the sources that did succeed is still committed.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    outputs:
      outcome: ${{ steps.run.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra ai --frozen

      - name: Collect, validate, build site data, write brief
        id: run
        continue-on-error: true
        env:
          # Optional. Without it the brief falls back to the deterministic template.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run gpu-index run

      - name: Job summary
        if: always()
        run: |
          {
            echo "### GPU price index — $(date -u +%F)"
            echo '```'
            uv run gpu-index show
            echo '```'
            echo "#### Run record"
            echo '```json'
            tail -n 1 data/runs.jsonl | python3 -m json.tool
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: prices for $(date -u +%F)"
          git pull --rebase origin main  # main may have moved during the run
          git push

      - name: Open or update failure issue
        if: always() && (steps.run.outcome == 'failure' || steps.commit.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          record=$(tail -n 1 data/runs.jsonl | python3 -m json.tool)
          body=$(printf 'Collection run failed (run step: %s, commit/push step: %s): %s\n\n```json\n%s\n```\n' \
            "${{ steps.run.outcome }}" "${{ steps.commit.outcome }}" "$run_url" "$record")
          gh label create pipeline-failure --color d03b3b --description "Daily collection failed" --force
          existing=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Daily price collection failed" --label pipeline-failure --body "$body"
          fi
          exit 1

      - name: Close failure issue after recovery
        if: always() && steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label pipeline-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done

  deploy:
    needs: collect
    # Deploy whatever was committed, even after a partial failure.
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
