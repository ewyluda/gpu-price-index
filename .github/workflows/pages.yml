name: Deploy dashboard

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
  # Called by collect.yml after the daily data commit (pushes made with
  # GITHUB_TOKEN don't trigger other workflows, so the push path above won't fire).
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # pick up the data commit collect.yml just pushed
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
