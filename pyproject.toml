[project]
name = "gpu-index"
version = "1.0.0"
description = "An open, primary-source index of GPU rental prices across hyperscalers, neoclouds and marketplaces."
readme = "README.md"
license = "MIT"
authors = [{ name = "Eric Wyluda" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = ["anthropic>=0.70"]
mcp = ["mcp>=1.2"]

[project.scripts]
gpu-index = "gpu_index.cli:main"
gpu-index-mcp = "gpu_index.mcp_server:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-beautifulsoup4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_index"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gpu_index"]

[[tool.mypy.overrides]]
module = ["mcp.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
